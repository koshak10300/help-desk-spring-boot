<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ запрещён | Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>
    <div class="navbar-nav ms-auto">
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-sm border-0">
        <div class="card-body p-5">
          <h1 class="display-4 fw-bold text-danger mb-4">403</h1>
          <h2 class="h3 mb-3">Ошибка 403: доступ запрещён</h2>
          <p class="text-muted mb-4">
            У вас нет прав для просмотра администраторской зоны
          </p>
          <div class="d-flex gap-3 justify-content-center">
            <a th:href="@{/}" class="btn btn-primary">
              Вернуться на главную
            </a>
            <form th:action="@{/logout}" method="post">
              <input type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}">
              <button type="submit" class="btn btn-outline-danger">
                Выйти из аккаунта
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
