<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Админ-панель | Help Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <div class="d-flex align-items-center gap-3">
            <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    Выйти
                </button>
            </form>
        </div>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/}">Главная</a>
            <a class="nav-link active" th:href="@{/admin/tickets}">Админ-панель</a>
            <a class="nav-link" th:href="@{/about}">О нас</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Список заявок</h1>
            <p class="text-muted mb-0">Закрытая зона администратора</p>
        </div>
        <span class="badge bg-primary fs-6"
              th:text="${#lists.size(tickets)} + ' заявок'">
            0 заявок
        </span>
    </div>

    <div class="table-responsive shadow-sm">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Пользователь</th>
                <th>Тема</th>
                <th>Описание</th>
                <th>Статус</th>
                <th>Дата создания</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}">1</td>
                <td th:text="${ticket.customerName}">Иван</td>
                <td th:text="${ticket.title}">Не работает ПК</td>
                <td th:text="${ticket.description}">Описание</td>
                <td>
                    <span class="badge bg-secondary" th:text="${ticket.status}">NEW</span>
                </td>
                <td th:text="${#temporals.format(ticket.createdAt, 'dd.MM.yyyy HH:mm')}">
                    01.01.2026 10:00
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tickets)}">
                <td colspan="6" class="text-center text-muted py-4">
                    Пока нет ни одной заявки
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
